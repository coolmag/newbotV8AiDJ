# Конфигурация окружения для Railway
[phases.setup]
# Устанавливаем Python, FFmpeg (для аудио) и Node.js (для подписи YouTube)
nixPkgs = ["python3", "ffmpeg", "nodejs"]

[phases.install]
# Установка зависимостей Python
cmds = ["python -m pip install -r requirements.txt"]

[start]
# Команда запуска
cmd = "uvicorn main:app --host 0.0.0.0 --port $PORT"
