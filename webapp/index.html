<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aurora Tape Deck</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght @500;700&family=Inter:wght @400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <!-- Версия 30 для сброса кэша стилей -->
    <link rel="stylesheet" href="style.css?v=30">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <canvas id="visualizer-canvas"></canvas>
    
    <div id="app-container">
        <!-- КОРПУС МАГНИТОФОНА -->
        <div class="tape-deck">
            <div class="screw screw-tl"></div>
            <div class="screw screw-tr"></div>
            <div class="screw screw-bl"></div>
            <div class="screw screw-br"></div>

            <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
            <div class="deck-header">
                <button class="metal-btn mini" id="btn-open-genres"><span class="material-icons-round">grid_view</span></button>
                <div class="brand-plate">
                    <span>AURORA</span>
                    <small>GX-4000D AI</small>
                </div>
                <button class="metal-btn mini" id="btn-open-playlist"><span class="material-icons-round">playlist_play</span></button>
            </div>

            <!-- КАТУШКИ -->
            <div class="reels-section">
                <div class="reel-container">
                    <div class="reel left" id="reel-left">
                        <div class="reel-spokes"></div>
                        <div class="reel-tape"></div>
                        <div class="reel-center"></div>
                    </div>
                </div>
                
                <div class="head-block">
                    <div class="tape-path"></div>
                    <div class="head-cover">
                         <h1 id="track-title-scrolling" class="scrolling-text">SYSTEM READY</h1>
                    </div>
                </div>

                <div class="reel-container">
                    <div class="reel right" id="reel-right">
                        <div class="reel-spokes"></div>
                        <div class="reel-tape inside"></div>
                        <div class="reel-center"></div>
                    </div>
                </div>
            </div>

            <!-- ДИСПЛЕЙ -->
            <div class="track-display">
                <p id="track-artist">INSERT TAPE</p>
                <div class="time-counter">
                    <span id="time-current">0000</span>
                </div>
            </div>

            <!-- ИНДИКАТОРЫ И УПРАВЛЕНИЕ -->
            <div class="controls-section">
                <div class="vu-meters-container">
                    <div class="vu-meter">
                        <div class="vu-scale"></div>
                        <div class="vu-needle" id="needle-l"></div>
                        <div class="vu-label">L</div>
                    </div>
                    <div class="vu-meter">
                        <div class="vu-scale"></div>
                        <div class="vu-needle" id="needle-r"></div>
                        <div class="vu-label">R</div>
                    </div>
                </div>

                <div class="deck-controls">
                    <button class="lever-btn" id="btn-prev"><span class="material-icons-round">fast_rewind</span></button>
                    <button class="lever-btn main-play" id="btn-play-pause">
                        <div class="led-indicator"></div>
                        <span class="material-icons-round">play_arrow</span>
                    </button>
                    <button class="lever-btn" id="btn-next"><span class="material-icons-round">fast_forward</span></button>
                </div>
            </div>

            <!-- НИЖНЯЯ ПАНЕЛЬ -->
            <div class="bottom-panel">
                <div class="volume-knob-container">
                    <span class="material-icons-round small-icon" id="icon-vol-mute">volume_off</span>
                    <div class="vol-slider-metal" id="vol-bg">
                        <div class="vol-knob" id="vol-knob"></div>
                    </div>
                    <span class="material-icons-round small-icon">volume_up</span>
                </div>
                
                <div class="aux-controls">
                    <button class="round-metal-btn" id="btn-shuffle"><span class="material-icons-round">shuffle</span></button>
                    <button class="round-metal-btn" id="btn-ai"><span class="material-icons-round" style="color: #bc13fe;">psychology</span></button>
                    <button class="round-metal-btn" id="btn-fx"><span class="material-icons-round">equalizer</span></button>
                </div>
            </div>
            
            <div id="system-log" class="lcd-log">WAITING...</div>
        </div>

        <div id="start-overlay" class="start-screen">
            <div class="start-title">AURORA <span style="font-size:12px">HIFI</span></div>
            <button id="btn-start-system" class="start-btn">POWER ON</button>
        </div>
        
        <div class="overlay" id="overlay"></div>
        <div class="drawer" id="drawer-genres"><h2>Tape Library</h2><div class="scroll-area genre-grid" id="genre-grid"></div></div>
        <div class="drawer" id="drawer-playlist"><h2>Playlist</h2><div class="scroll-area" id="playlist-container"></div></div>
    </div>
    
    <div id="ai-modal" class="ai-modal-overlay">
        <div class="ai-card">
            <h2>AI SELECTOR</h2>
            <input type="text" id="ai-input" placeholder="Mood / Genre..." autocomplete="off">
            <div class="ai-actions">
                <button id="btn-ai-cancel" class="btn-text">CANCEL</button>
                <button id="btn-ai-send" class="btn-glow">LOAD</button>
            </div>
        </div>
    </div>

    <audio id="audio-player" crossorigin="anonymous"></audio>
    <script>
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js').then(r => r.update());
    </script>
    <script src="js/main.js" type="module"></script>
</body>
</html>
