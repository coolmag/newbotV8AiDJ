<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Tape</title>
    <link rel="stylesheet" href="style.min.css">
    <link rel="icon" href="favicon.svg">
</head>
<body>
    <div id="cassette">
        <div id="cassette-top"></div>
        <div id="cassette-main">
            <div id="label">
                <div id="title">AURORA PLAYER</div>
                <div id="artist">READY</div>
                <div id="progress"><div id="progress-bar"></div></div>
            </div>
            <div id="window">
                <div class="reel-hole left"><div id="reel-left" class="reel"></div></div>
                <div class="reel-hole right"><div id="reel-right" class="reel"></div></div>
            </div>
        </div>
    </div>

    <div id="controls">
        <button id="btn-prev">⏮</button>
        <button id="btn-play">▶</button>
        <button id="btn-next">⏭</button>
        <button id="btn-playlist">☰</button>
        <button id="btn-ai">🤖</button>
    </div>

    <div id="drawer-container">
        <div id="overlay"></div>
        <div id="drawer" class="drawer">
            <h3 id="drawer-title"></h3>
            <div id="drawer-content"></div>
        </div>
    </div>
    
    <div id="ai-modal" class="modal">
        <input id="ai-input" placeholder="Что включить?">
        <button id="btn-ai-send">Пуск</button>
        <button id="btn-ai-cancel">Отмена</button>
    </div>

    <script src="app.min.js"></script>
</body>
</html>
